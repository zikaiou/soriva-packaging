name: Monitor SORIVA RFQ database

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production RFQ database availability
        shell: bash
        env:
          HEALTH_URL: https://www.sorivapackaging.com/api/rfq/health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors \
            "$HEALTH_URL" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True and data.get("service") == "rfq-database", "RFQ database is unavailable"'
          echo "SORIVA RFQ database health check passed."
